# ==============================================================================
# RT-DETRv2-OBB-Small 双流特征级直接拼接基线 (Naive Concat Baseline)
# ==============================================================================

__include__: [
  '../dataset/dronevehicle_rgbt.yml',    # 引用成对多模态数据集配置
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/rtv2_optimizer.yml',
  '../base/rtv2_r50vd.yml',
]

# 独立输出目录，方便与单模态结果对比
output_dir: ./outputs/rtdetrv2_obb_hgnetv2_s_dronevehicle_concat_baseline

eval_spatial_size: [640, 640]

RTv4:
  backbone: DualHGNetv2_Concat          # 替换为双流拼接主干
  encoder: HybridEncoder
  decoder: RTDETRTransformerv2OBB

# 声明双流主干的初始化参数 (两路独立加载 ImageNet 预训练权重)
DualHGNetv2_Concat:
  name: 'B0'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True
  pretrained: True
  local_model_dir: ./pretrain/hgnetv2/

criterion: RTv4OBBCriterion

postprocessor: PostProcessorOBB

PostProcessorOBB:
  num_top_queries: 300
  input_shape: [640, 640]

# 混合编码器：接收 DualHGNetv2_Concat 降维后输出的标准 [256, 512, 1024] 特征
HybridEncoder:
  in_channels: [256, 512, 1024]
  version: rt_detrv2
  expansion: 0.5
  depth_mult: 0.34
  hidden_dim: 224

RTDETRTransformerv2OBB:
  feat_channels: [224, 224, 224]
  feat_strides: [8, 16, 32]
  hidden_dim: 224
  num_levels: 3
  num_layers: 3
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  learn_query_content: False
  eval_idx: -1
  num_points: [4, 4, 4]
  cross_attn_method: default
  query_select_method: default
  query_pos_method: default
  anchor_aspect_ratio: 1.0

RTv4OBBCriterion:
  weight_dict: {loss_focal: 1, loss_l1: 5, loss_kld: 5}
  losses: ['focal', 'l1', 'kld']
  alpha: 0.75
  gamma: 2.0
  use_uni_set: True
  matcher:
    type: HungarianMatcherOBB
    weight_dict: {cost_class: 2, cost_bbox: 0, cost_hausdorff: 5, cost_giou: 5}
    alpha: 0.25
    gamma: 2.0

epoches: 142
checkpoint_freq: 40                     # 每 40 轮存档一次，保护磁盘

lrsheduler: flatcosine
warmup_iter: 2000
flat_epoch: 70
no_aug_epoch: 12
lr_gamma: 0.1
optimizer:
  type: AdamW
  params:
    -
      # 正则表达式同时匹配 backbone_ir 与 backbone_rgb 的 norm/bn 层
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00001
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_warmup_scheduler: ~

train_dataloader:
  total_batch_size: 4                  # 稳健 Batch Size，防止显存溢出
  dataset:
    transforms:
      ops:
        # 1. 双模态锁步四图拼接 (生成 2 张完全对齐的超级画布)
        - {type: PairedMosaicOBB, output_size: 640, rotation_range: 0, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
           probability: 1.0, fill_value: 0}
        # 2. 物理安全色彩抖动 (仅作用于 RGB，不改动 IR 热辐射)
        - {type: PairedPhotometricDistortRGBOnly, p: 0.5}
        - {type: PairedSanitizeBoundingBoxesOBB, min_size: 1}
        # 3. 双模态锁步 ZoomOut (模拟拉高小目标) + IoUCrop (模拟低空截断)，与 Mosaic 互斥见 container.py
        - {type: PairedRandomZoomOutOBB, fill: 0, side_range: [1.0, 4.0], p: 0.5}
        - {type: PairedRandomIoUCropOBB, p: 0.8}
        # 4. 双模态锁步水平镜像翻转 (航拍俯视左右对称，上下翻转不符合重力先验故不用)
        - {type: PairedRandomHorizontalFlipOBB, p: 0.5}
        # 4. 双模态统一缩放至 640x640
        - {type: PairedResizeOBB, size: [640, 640]}
        - {type: PairedSanitizeBoundingBoxesOBB, min_size: 1}
        # 5. 转换为 6 通道张量 [6, 640, 640]
        - {type: PairedConvertPILToTensor, dtype: 'float32', scale: True}
        # 6. 旋转边界框坐标归一化
        - {type: PairedConvertOBB, normalize: True}
      policy:
        name: stop_epoch
        epoch: [4, 82, 120]
        # 与单模一致：强增强仅中间段生效，首尾 NoAug；Mosaic 与 ZoomOut/IoUCrop 互斥见 container.py
        ops: ['PairedMosaicOBB', 'PairedPhotometricDistortRGBOnly', 'PairedRandomZoomOutOBB', 'PairedRandomIoUCropOBB']
      mosaic_prob: 0.5

  collate_fn:
    base_size: 640
    base_size_repeat: ~
    mixup_prob: 0.0                     # 基线期专注纯净拼接，暂关闭混叠
    stop_epoch: 120
    ema_restart_decay: 0.9999

val_dataloader:
  total_batch_size: 4
  dataset:
    transforms:
      ops:
        - {type: PairedResizeOBB, size: [640, 640], keep_ratio: True, pad_to_size: True, fill: 0}
        - {type: PairedSanitizeBoundingBoxesOBB, min_size: 1.0}
        - {type: PairedConvertPILToTensor, dtype: 'float32', scale: True}
        - {type: PairedConvertOBB, normalize: True}