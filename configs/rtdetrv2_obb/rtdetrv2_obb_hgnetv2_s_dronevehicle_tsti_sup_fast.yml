# ==============================================================================
# 极速最小验证版 (Fast Prototype): 带高斯热力图显式监督的 TSTI
# 特点: 砍掉所有复杂增强 (无Mosaic/ZoomOut/IoUCrop)，极少Epoch，极速验证！
# ==============================================================================

__include__: [
  '../dataset/dronevehicle_rgbt.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/rtv2_optimizer.yml',
  '../base/rtv2_r50vd.yml',
]

output_dir: ./outputs/fast_proto_tsti_sup

eval_spatial_size: [640, 640]

RTv4:
  backbone: AsymHGNetv2_TSTI_Sup
  encoder: HybridEncoder
  decoder: RTDETRTransformerv2OBB

AsymHGNetv2_TSTI_Sup:
  name: 'B0'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True
  pretrained: True
  local_model_dir: ./pretrain/hgnetv2/
  top_rho: 0.25                         

criterion: RTv4OBBCriterion
postprocessor: PostProcessorOBB

PostProcessorOBB:
  num_top_queries: 300
  input_shape: [640, 640]

HybridEncoder:
  in_channels: [256, 512, 1024]
  version: rt_detrv2
  expansion: 0.5
  depth_mult: 0.34
  hidden_dim: 224

RTDETRTransformerv2OBB:
  feat_channels: [224, 224, 224]
  feat_strides: [8, 16, 32]
  hidden_dim: 224
  num_levels: 3
  num_layers: 3
  num_queries: 300
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  learn_query_content: False
  eval_idx: -1
  num_points: [4, 4, 4]
  cross_attn_method: default
  query_select_method: default
  query_pos_method: default
  anchor_aspect_ratio: 1.0

RTv4OBBCriterion:
  # 【核心修改】：开启 loss_saliency 的监督权重
  weight_dict: {loss_focal: 1, loss_l1: 5, loss_kld: 5, loss_saliency: 2.0}
  losses: ['focal', 'l1', 'kld', 'saliency']
  alpha: 0.75
  gamma: 2.0
  use_uni_set: True
  matcher:
    type: HungarianMatcherOBB
    weight_dict: {cost_class: 2, cost_bbox: 0, cost_hausdorff: 5, cost_giou: 5}
    alpha: 0.25
    gamma: 2.0

# 【极速实验设置】总轮数 36 轮，快速看结果！
epoches: 36
checkpoint_freq: 10

lrsheduler: flatcosine
warmup_iter: 200
flat_epoch: 12
no_aug_epoch: 4
lr_gamma: 0.1
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00001
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_warmup_scheduler: ~

train_dataloader:
  total_batch_size: 8                  # 本地 3080 显存安全值
  num_workers: 4                       # 降低 CPU 负担
  dataset:
    transforms:
      ops:
        # 【极简增强】只保留基础变形，没有任何高耗时拼接！
        - {type: PairedRandomHorizontalFlipOBB, p: 0.5}
        # 修改后（必须加上 keep_ratio 和 pad_to_size）：
        - {type: PairedResizeOBB, size: [640, 640], keep_ratio: True, pad_to_size: True, fill: 0}
        - {type: PairedSanitizeBoundingBoxesOBB, min_size: 1}
        - {type: PairedConvertPILToTensor, dtype: 'float32', scale: True}
        - {type: PairedConvertOBB, normalize: True}
      policy:
        name: default                  # 放弃分阶段增强，直接使用上面的极简配置

  collate_fn:
    base_size: 640
    base_size_repeat: ~
    mixup_prob: 0.0                     
    stop_epoch: 36
    ema_restart_decay: 0.9999

val_dataloader:
  total_batch_size: 16
  num_workers: 4
  dataset:
    transforms:
      ops:
        - {type: PairedResizeOBB, size: [640, 640], keep_ratio: True, pad_to_size: True, fill: 0}
        - {type: PairedSanitizeBoundingBoxesOBB, min_size: 1.0}
        - {type: PairedConvertPILToTensor, dtype: 'float32', scale: True}
        - {type: PairedConvertOBB, normalize: True}